name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: sangram0105/bla-bla-cars
  PLATFORMS: linux/amd64

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            dockerfile: UserService/Dockerfile
          - service: booking-service
            dockerfile: BookingService/Dockerfile
          - service: trip-service
            dockerfile: TripService/Dockerfile
          - service: chat-service
            dockerfile: ChatService/Dockerfile
          - service: api-gateway
            dockerfile: ApiGateway/Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ matrix.service }}-
            type=ref,event=branch,prefix=${{ matrix.service }}-
            type=ref,event=tag,prefix=${{ matrix.service }}-
            type=raw,value=${{ matrix.service }}-latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
